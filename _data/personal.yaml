  - 'I am a Ph.D. student in Computational Science and Engineering at Georgia Tech, advised by <a href="https://poloclub.github.io/polochau/">Dr. Polo Chau</a>. My research focuses on machine learning interpretability and visualization, with previous experience in simulation, visualization, and data analysis from working as a military analyst through the Department of Defense <a href="https://www.smartscholarship.org/smart/en">SMART scholarship</a>.'
