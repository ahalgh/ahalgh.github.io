- id: unipo
  type: preprint
  featured: true
  title: "UNIPO: Unified Interactive Visual Explanation for RL Fine-Tuning Policy Optimization"
  authors:
    - "Cho, A."
    - "Greenhalgh, A.D."
    - "Bodea, J."
    - "Peng, A."
    - "Chau, D.H."
  year: 2026
  venue: "arXiv preprint"
  venue_tags:
    - "arXiv'26"
    - "Under Review"
  summary: ""
  details: 'arXiv:<a href="https://arxiv.org/abs/2605.11549">2605.11549</a>'
  doi: ""
  pdf: "https://arxiv.org/abs/2605.11549"
  abstract: "Reinforcement learning has emerged as a dominant technique for fine-tuning the behavior of large language models, with policy optimization (PO) algorithms such as GRPO, DAPO, and Dr. GRPO emerging in rapid succession to advance state-of-the-art reasoning and alignment performance. However, the modular differences between these algorithms, including targeted improvements to clipping, advantage estimation, and reward aggregation, are introduced across separate papers with inconsistent notation, making them difficult to compare and intimidating to the non-expert community. We present UNIPO, the first interactive visualization tool that exposes the token-level training dynamics of RL fine-tuning algorithms through a unified design. UNIPO connects three complementary views — a high-level training overview, a step-level prompt and response inspector, and a side-by-side algorithm comparison — allowing learners to observe how individual design decisions propagate through training. Through two usage scenarios, we demonstrate how UNIPO supports both classroom instruction for non-experts and algorithm selection for AI practitioners. Our tool is open-source and publicly available at https://poloclub.github.io/unipo/."
