- id: atomic-ordering
  type: journal
  featured: true
  title: "Assessment of Local Observation of Atomic Ordering in Alloys via the Radial Distribution Function: A Computational and Experimental Approach"
  authors:
    - "Greenhalgh, A.D."
    - "Sanjeewa, L.D."
    - "Luszczek, P."
    - "Maroulas, V."
    - "Rios, O."
    - "Keffer, D.J."
  year: 2021
  venue: "Frontiers in Materials"
  venue_tags:
    - "Frontiers in Materials '21"
  summary: ""
  highlights:
    - icon: "fas fa-medal"
      text: "Poster Finalist"
  collaborations:
    - icon: "fas fa-building"
      text: "ORNL"
      url: "https://www.ornl.gov/"
  details: "December 2021"
  doi: ""
  pdf: "https://www.frontiersin.org/journals/materials/articles/10.3389/fmats.2021.797418/full"
  abstract: "As a powerful analytical technique, atom probe tomography (APT) has the capacity to acquire the spatial distribution of millions of atoms from a complex sample. However, extracting information at the Ångstrom-scale on atomic ordering remains a challenge due to the limits of the APT experiment and data analysis algorithms. The development of new computational tools enable visualization of the data and aid understanding of the physical phenomena such as disorder of complex crystalline structures. Here, we report progress towards this goal using two steps. We describe a computational approach to evaluate atomic ordering in the crystal structure by generating radial distribution functions (RDF). Atomic ordering is rendered as the Fractional Cumulative Radial Distribution Function (FCRDF) which allows for greater visibility of local compositions at short range in the structure. Further, we accommodate in the analysis additional parameters such as uncertainty in the atomic coordinates and the atomic abundance to ascertain short-range ordering in APT data sets. We applied the FCRDF analysis to synthetic and experimental APT data set for Ni3Al. The ability to observe a signal of atomic ordering consistent with the known L12 crystal structure is heavily dependent on spatial uncertainty, irrespective of abundance. Detection of atomic ordering is subject to an upper limit of spatial uncertainty of atoms described with Gaussian distributions with a standard deviation of 1.3 Å. The FCRDF analysis was also applied to the APT data set for a six-component alloy, Al1.3CoCrCuFeNi. In this case, we are currently able to visualize elemental segregation at the nanoscale, though unambiguous identification of atomic ordering at the Ångstrom (nearest-neighbor) scale remains a goal."
