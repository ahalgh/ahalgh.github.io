- id: holographic-imaging
  type: journal
  featured: true
  title: "Considerations for in situ, real time measurement of plasma-material interactions using Digital Holographic imaging"
  authors:
    - "Biewer, T."
    - "Smith, C."
    - "Gebhart, T."
    - "Greenhalgh, A.D."
    - "Ren, X."
    - "Thomas, C."
  year: 2020
  venue: "Journal of Instrumentation"
  venue_tags:
    - "JINST'20"
  summary: ""
  collaborations:
    - icon: "fas fa-building"
      text: "ORNL"
      url: "https://www.ornl.gov/"
  details: "15(2), C02017, February 2020"
  doi: ""
  pdf: "https://iopscience.iop.org/article/10.1088/1748-0221/15/02/C02017"
  abstract: "Digital Holographic (DH) imaging is a laser-based measurement technique, which can be used to monitor a material surface as it is being exposed to fusion-relevant plasmas. Both single-laser and dual-laser DH measurements have been demonstrated ex situ at Oak Ridge National Laboratory (ORNL). A DH diagnostic system is being assessed for deployment at ORNL to make in situ, real-time measurements of plasma erosion/redeposition in the Prototype Material Plasma Exposure eXperiment (Proto-MPEX). In situ, real time measurements pose unique challenges to diagnostic systems, which are not encountered by ex situ analysis techniques. The absolute surface height (tracked at the nm to μm position) during plasma exposure can be modified by: 1) surface movement due to vibration or thrust exerted by the plasma device, 2) surface growth due to the thermal expansion of the material under steady MW/m² or transient GW/m² plasma heat loads, and 3) surface modification due to plasma erosion/redeposition of the material substrate. To assess these effects, 1) the vibration spectrum of the diagnostic and the pulsed plasma device have been measured, 2) the thermal growth of the surface has been measured for an applied heat flux, and 3) the surface modification has been measured ex situ post plasma exposure, and ex situ post laser ablation as a proxy for the plasma. This paper will provide an overview of the results that have been achieved in the development of a DH diagnostic for in situ real-time measurements of plasma exposed surfaces in the Proto-MPEX device."
